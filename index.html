<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- edge to edge, with the safe areas padded by the app, and resized by on-screen keyboards -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="oklch(1 0 0)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="oklch(0.145 0 0)" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>BearChat</title>
    <style>
      /* painted before the stylesheet loads, matching --background in index.css */
      html {
        background: oklch(1 0 0);
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: oklch(0.145 0 0);
        }
      }
      .startup {
        position: fixed;
        inset: 50% auto auto 50%;
        width: 1.5rem;
        height: 1.5rem;
        margin: -0.75rem;
        border: 2px solid #8888;
        border-top-color: #888;
        border-radius: 50%;
        opacity: 0;
        animation:
          startup-spin 0.8s linear infinite,
          startup-show 0.2s 0.5s forwards;
      }
      @keyframes startup-spin {
        to {
          rotate: 1turn;
        }
      }
      @keyframes startup-show {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- replaced on the first render, the indicator only fades in if starting takes a while -->
    <div id="root"><div class="startup"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
