name: release
on:
  push:
    branches: [main, beta]
permissions: {}
# Never cancel a running release halfway through publishing. The group must
# differ from the one of check.yml, which runs within this workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
  release:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'mirkolenz' }}
    needs: check
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semanticrelease.outputs.released }}
      git-head: ${{ steps.semanticrelease.outputs.git-head }}
    environment:
      name: release
      url: https://github.com/mirkolenz/bearchat/releases/tag/${{ steps.semanticrelease.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cihelper/action-semanticrelease-npm@v1
        id: semanticrelease
  # A demo without config.json, where visitors enter their own server.
  build-demo:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      pages: read
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.git-head }}
      - uses: actions/configure-pages@v6
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            log-lines = 1000
      - run: nix build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./result
  deploy-demo:
    runs-on: ubuntu-latest
    needs: build-demo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
