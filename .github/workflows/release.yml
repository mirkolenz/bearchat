name: release
on:
  push:
    branches: [main, beta]
permissions: {}
# Never cancel a running release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
  release:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'mirkolenz' }}
    needs: check
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/mirkolenz/bearchat/releases/tag/${{ steps.semanticrelease.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cihelper/action-semanticrelease-npm@v1.3.5
        id: semanticrelease
