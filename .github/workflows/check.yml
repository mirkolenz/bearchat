name: check
# Pushes run it through release.yml.
on:
  pull_request:
  workflow_call:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            log-lines = 1000
      - run: nix flake check --show-trace
